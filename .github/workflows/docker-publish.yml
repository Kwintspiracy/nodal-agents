name: Docker — Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `packages: write` lets the GITHUB_TOKEN push to ghcr.io. Docker Hub
      # uses its own DOCKERHUB_TOKEN secret, no GitHub permission needed.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          # arm64 emulation for cross-arch build. amd64 runs natively on the runner.
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # ── Docker Hub login (primary registry — what Container Manager,
      # docker pull, and every Docker tool defaults to)
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── ghcr.io login (secondary — kept for GitHub-integrated workflows)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Same tags applied to BOTH registries. Each `images` entry becomes
          # a target the same blob is pushed to.
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nodal-agents
            ghcr.io/${{ github.repository }}
          # `latest` for main branch, `X.Y.Z` for version tags (the `v`
          # prefix is stripped by `{{version}}`), `X.Y` minor alias.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
