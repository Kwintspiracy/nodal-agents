name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SC-2 (audit sécu 2026-07-07): least-privilege GITHUB_TOKEN. CI only checks out
# and runs tests — it never writes to the repo, so a read-only token removes the
# blast radius of a compromised action or dependency.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose — pnpm/action-setup@v4 reads the
      # version from the `packageManager` field in the root package.json.
      # Specifying both causes ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # SEC-1: block a hardcoded secret from reaching the public repo. Runs on
      # the tracked tree at HEAD (works on the shallow checkout); annotate a
      # vetted fixture with `secrets:allow` to suppress a false positive.
      - name: Secret scan
        run: pnpm secrets:check

      - name: Architecture check
        run: pnpm deps:check

      - name: Unit tests
        # Cap turbo concurrency: running all ~26 package suites at once (each with
        # its own vitest worker pool) oversubscribes the shared runner and starves
        # individual tests into per-test timeouts. 3 at a time + the 60s global
        # timeout keeps it reliable. (--concurrency is a TURBO flag — pass it to
        # turbo directly, NOT via `pnpm test -- …` which forwards it to vitest.)
        run: pnpm exec turbo run test --concurrency=3
