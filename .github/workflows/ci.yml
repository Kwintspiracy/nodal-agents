name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SC-2 (audit sécu 2026-07-07): least-privilege GITHUB_TOKEN. CI only checks out
# and runs tests — it never writes to the repo, so a read-only token removes the
# blast radius of a compromised action or dependency.
permissions:
  contents: read

# ── Pourquoi plusieurs jobs (#291, 2026-09-21) ──────────────────────────────
#
# Jusqu'au 20/09 un seul job `ci` enchaînait tout : typecheck, lint, format,
# scans, la suite unitaire, le banc, puis le build. À froid il mettait 23 min à
# ATTEINDRE le build et se faisait couper par son propre délai sur un arbre
# vert (run 105953811231 : 25 min 15 s contre 25 de budget). La suite seule
# pesait 16 min 43 s, dont `apps/web` 760 s et `apps/runner` 764 s, chacun
# plus long que la cible d'une PR entière.
#
# Découpage :
#   - `checks` : tout ce qui n'est ni la suite ni le build (~6 min à froid) ;
#   - `test`   : la suite en CINQ tranches parallèles — `web` et `runner`
#                coupés en deux par fichier (`vitest --shard`), et tous les
#                autres paquets ensemble ;
#   - `build`  : le build seul, pour que « le build casse » et « la suite a
#                grossi » soient deux rouges distincts.
# Les trois partagent l'install par le cache pnpm ; chacun a SA lignée de
# cache turbo (voir le commentaire du cache), parce qu'une clé partagée
# n'aurait gardé que les sorties du premier job fini.
#
# `ci-windows` a quitté ce fichier : il ne tourne plus sur les PR mais sur
# `main` et chaque nuit (`ci-windows.yml`). En 29 min par PR, il n'a jamais
# trouvé un défaut Windows que le job Linux avait laissé passer.
#
# Budgets : deux fois la durée mesurée à froid, la mesure écrite à côté. Un
# job qui double est coupé ; un job qui dérive de deux minutes ne l'est pas.
#
# Hors périmètre : le cache turbo distant (payant, décision de Quentin) et
# rendre les tests eux-mêmes plus rapides (#280, dette 0.9.2).

jobs:
  # ── Contrôles statiques ─────────────────────────────────────────────────────
  # Typecheck 3 min 56 s à froid, lint 1 min 04 s, format 30 s, les scans et
  # le banc moins d'une minute à eux tous (job 105953811231, 19/09) : environ
  # 6 min 30 s. Mesuré à 6 min 51 s sur la PR de #291 (run 35517309819,
  # cache turbo froid pour cette lignée) → budget 14.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose — pnpm/action-setup@v4 reads the
      # version from the `packageManager` field in the root package.json.
      # Specifying both causes ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      # Turborepo's own cache, persisted between runs.
      #
      # Without it, every push re-ran every task for all ~34 packages — even
      # the 33 nobody had touched. Measured on the run for PR #42, where only
      # apps/runner changed: unit tests 595s, typecheck 222s, build 165s, out
      # of an 18-minute job. `pnpm install` was 6s, because THAT cache exists.
      #
      # GitHub caches are immutable: the first job to finish claims the key.
      # Since #291 several jobs of this workflow run turbo at once, so each
      # one has ITS OWN lineage (`turbo-<os>-<job>-<shard>-<sha>`) and falls
      # back to the most recent entry of that lineage. A shared key would have
      # kept only the outputs of whichever job finished first and locked the
      # others out — the same trap pack-smoke and e2e-smoke fell into before
      # they lost their cache step (found by codex review).
      #
      # Sizes: ~176 MB for the `build` lineage (the `build` task declares
      # outputs), a few hundred KB for the others (typecheck/test declare
      # none, so only logs and the up-to-date markers are stored — which is
      # all that is needed to SKIP them). GitHub caps a repository at 10 GB
      # and evicts least-recently-used entries on its own; if busy branches
      # ever start missing, narrow the key to main rather than growing the
      # budget.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-checks-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-checks-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # SEC-1: block a hardcoded secret from reaching the public repo. Runs on
      # the tracked tree at HEAD (works on the shallow checkout); annotate a
      # vetted fixture with `secrets:allow` to suppress a false positive.
      - name: Secret scan
        run: pnpm secrets:check

      # The pre-commit hook already runs this on staged files, but a hook lives
      # on a developer's machine and can be skipped. This is the copy nobody
      # can bypass. It catches damaged content (NUL bytes, UTF-16) and files
      # that drifted into the tree — see scripts/check-commit-hygiene.mjs for
      # the two 2026-08-21 incidents that motivated each check.
      - name: Commit hygiene
        run: pnpm hygiene:check

      - name: Architecture check
        run: pnpm deps:check

      # Le lien entre le produit et ses preuves. Ne juge AUCUN résultat : elle
      # lit les titres des tests versionnés et refuse deux pourritures
      # silencieuses — une étiquette `@cap:` qui ne désigne plus rien, et une
      # capacité exigée que plus aucun test ne revendique. Quelques secondes,
      # sans build ni base, ce qui est la raison pour laquelle elle peut tourner
      # sur chaque PR.
      - name: Capacités du produit
        run: pnpm capacites:check

      # scripts/ lives outside the workspace, so `turbo run test` never sees it.
      # Its suites were effectively dead code until 0.8.0 shipped a broken pack.
      - name: Script tests
        run: pnpm test:scripts

      # Le banc répond à une AUTRE question que la suite : pas « est-ce
      # cassé ? » mais « qu'est-ce qui a CHANGÉ, et de combien ». Il sort en 1
      # dès qu'une métrique s'écarte de sa baseline acceptée.
      #
      # Il existait depuis le 11/08 et RIEN ne le lançait. Le 10/09/2026, un
      # premier passage a trouvé la section `gate` en régression : deux
      # décisions d'approbation étaient passées de « passe » à « demande »
      # depuis la 0.8.9. Un changement voulu — mais il aurait tout aussi bien pu
      # être l'inverse, et il serait parti en production sans un mot.
      #
      # Bloquant, et c'est le point : une régression de métrique s'accepte
      # sciemment (`pnpm bench --update`, qui réécrit la baseline et se
      # committe), jamais par omission. La section `catalog-drift` reste hors
      # course — elle interroge l'API du fournisseur, et un incident chez lui
      # n'est pas une régression chez nous.
      - name: Banc d'essai
        run: pnpm bench

      # SUPPLY-002 (audit 2026-08-07): nothing in CI ever looked at whether a
      # dependency had a known vulnerability. Non-blocking on purpose — on a
      # 5600-dependency tree a blocking gate produces noise a single maintainer
      # will end up disabling, and a disabled gate is worse than none because it
      # reads as coverage. `high` and above only, so the signal stays readable.
      - name: Dependency audit (advisory)
        run: pnpm audit --audit-level=high || true

  # ── La suite unitaire, en cinq tranches ─────────────────────────────────────
  # Durées à froid sous turbo à 3 (job 105953811231, 19/09) : web 760 s,
  # runner 764 s, tools 170 s, orchestration 131 s, db 103 s, memory 55 s,
  # cli 52 s, tout le reste sous 30 s chacun (≈ 200 s cumulés). `web` et
  # `runner` sont donc coupés en deux par fichier (`vitest run --shard=k/2`,
  # passé à vitest à travers turbo, qui l'inclut dans sa clé de cache), et
  # les autres paquets tournent ensemble.
  #
  # Le plafond de concurrence turbo (3) vit dans `turbo.json` depuis #292 :
  # `pnpm test`, `release:check` et ce job lancent exactement la même chose.
  # Mesuré sur la PR de #291 (run 35517309819, cache froid) : web 3 min 45 s
  # et 3 min 20 s, runner 3 min 37 s et 3 min 16 s, packages 4 min 45 s,
  # install et builds des dépendances compris → budget 10.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: web-1
            run: pnpm exec turbo run test --filter=@nodal-agents/web -- --shard=1/2
          - shard: web-2
            run: pnpm exec turbo run test --filter=@nodal-agents/web -- --shard=2/2
          - shard: runner-1
            run: pnpm exec turbo run test --filter=@nodal-agents/runner -- --shard=1/2
          - shard: runner-2
            run: pnpm exec turbo run test --filter=@nodal-agents/runner -- --shard=2/2
          - shard: packages
            run: pnpm exec turbo run test --filter=!@nodal-agents/web --filter=!@nodal-agents/runner
    name: test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      # Une lignée de cache par tranche (voir le commentaire du job `checks`).
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-test-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-test-${{ matrix.shard }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (${{ matrix.shard }})
        run: ${{ matrix.run }}

  # ── Le build seul ───────────────────────────────────────────────────────────
  # Audit finding: CI never actually built the apps (typecheck/lint catch
  # type/style errors but not a broken `next build` — e.g. a bad server
  # action boundary, an invalid import only webpack's build graph catches).
  # Full production build via turbo so a broken build fails CI instead of
  # only surfacing on deploy.
  #
  # Son propre job depuis #291 : avant, il venait en DERNIER d'un job de
  # 23 min et c'est lui que le délai coupait. Mesuré à 3 min 25 s sur la PR de
  # #291 (run 35517309819, cache froid) → budget 7.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      # La lignée `build` est la seule qui pèse (~176 MB : la tâche `build`
      # déclare ses sorties, et c'est ce qui rend un paquet intouché instantané).
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # ── Pack smoke test ─────────────────────────────────────────────────────────
  # SUPPLY-001 (audit 2026-08-07). `pnpm build` builds the WORKSPACE; it says
  # nothing about the TARBALL. Two releases shipped a dead dashboard because
  # nothing ever started the packed product before publish:
  #   0.8.0 — 7 server chunks lost by Next's standalone copy;
  #   0.8.1 — `next: "^16.2.6"` re-resolved to 16.3.0 at install time, so the
  #           tarball broke with no commit, no release and no signal.
  # This packs, installs clean into an isolated HOME, and BOOTS it. The CLI's own
  # assertWebRenders makes `up` exit non-zero when the dashboard does not render,
  # so a broken tarball fails here instead of on a user's machine.
  #
  # Its own job, in parallel with the others: it runs a full `next build` plus
  # a real Postgres boot, and folding that into another job would double the
  # feedback loop for every typo-level failure.
  pack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack, install clean, boot
        run: node scripts/smoke-pack.mjs

  # PERF-001 (audit 2026-08-07). 31 spec files, 85 tests, never run by CI —
  # so every UI regression this suite could catch had to be found by hand.
  #
  # BLOQUANT depuis le 11/08, sur décision de Quentin — après quatre passages
  # verts d'affilée. Il gate désormais au lieu de seulement rapporter.
  #
  # Ce qu'il a fallu pour en arriver là : le job n'avait JAMAIS dépassé son
  # global-setup depuis sa création. Il réclamait une authentification que le
  # mode par défaut ne sert pas, puis butait sur une installation neuve qui n'a
  # aucun agent et part en onboarding. Deux de ses trois parcours décrivaient
  # en plus un produit disparu depuis deux refontes d'UI.
  #
  # Si ce job flake, la cause est à traiter — pas le drapeau à remettre.
  #
  # Cinq parcours seulement (deux à l'origine : l'app démarre et se navigue,
  # l'onglet Autonomie répond ; trois ajoutés depuis, nommés à l'étape). Lancer
  # tous les fichiers ici coûterait un ordre de grandeur de plus que ce que ça
  # rapporte ; la mesure nocturne (`qa.yml`) les joue TOUS.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--with-deps` shells out to apt-get, which can hang forever on a stuck
      # mirror (2026-08-19: two consecutive 25-min hangs ate the whole job
      # budget). Bound each attempt to 5 min and retry once — fail LOUD and
      # fast instead of timing out the job.
      - name: Install Playwright browsers
        timeout-minutes: 12
        run: |
          for i in 1 2; do
            timeout 300 pnpm --filter @nodal-agents/web exec playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $i failed or hung — retrying"
          done
          exit 1

      # NOT `pnpm --filter @nodal-agents/web e2e:up`: that wrapper shells out to
      # a globally-installed `nodal-agents` binary, which does not exist on a
      # runner checking out source. First attempt died on `spawn ENOENT`.
      # The dev stack from source brings up embedded Postgres + runner + web.
      - name: Boot the stack
        run: pnpm --filter nodal-agents exec tsx src/index.ts --dev &

      - name: Wait for the dashboard
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null; then echo "web up"; exit 0; fi
            sleep 5
          done
          echo "dashboard never answered on :3000"; exit 1

      # Les autres parcours ne sont pas ici pour une raison de COÛT, pas de
      # capacité : depuis la sortie d'`agent-flows.spec.ts` (issue #110), plus
      # aucun fichier de `tests/e2e` n'exige de modèle, donc tous tournent sur
      # un runner. La mesure nocturne les joue tous, sans exception.
      # memory-kept.spec.ts joins the list because it is NEW (issue #110) and
      # because the whole point of that issue is that a journey nobody plays
      # proves nothing. It needs no model: it records a fact through the
      # screen and asks for it back.
      # activity-runs.spec.ts joins for the same reason memory-kept did: it is
      # NEW (issue #134) and it is the only screen proof that Activity lists
      # runs. A journey nobody plays proves nothing, and the nightly comes too
      # late to tell the PR that opened the screen.
      # edrow-narrow.spec.ts joins for the same reason the two above did: it
      # is NEW (issue #310), it needs no stack of its own (it mounts the
      # component and the real stylesheet in the browser), and it is the only
      # proof that a narrow row does not draw over itself. The nightly would
      # tell us a day after the screen shipped.
      - name: Six journeys — boot/navigation, the autonomy tab, delegation outcomes, memory, the runs list, a narrow row
        run: >
          pnpm --filter @nodal-agents/web exec playwright test
          tests/e2e/smoke.spec.ts
          tests/e2e/autonomy-approvals.spec.ts
          tests/e2e/delegation-outcome.spec.ts
          tests/e2e/memory-kept.spec.ts
          tests/e2e/activity-runs.spec.ts
          tests/e2e/edrow-narrow.spec.ts

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
