name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SC-2 (audit sécu 2026-07-07): least-privilege GITHUB_TOKEN. CI only checks out
# and runs tests — it never writes to the repo, so a read-only token removes the
# blast radius of a compromised action or dependency.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose — pnpm/action-setup@v4 reads the
      # version from the `packageManager` field in the root package.json.
      # Specifying both causes ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # SEC-1: block a hardcoded secret from reaching the public repo. Runs on
      # the tracked tree at HEAD (works on the shallow checkout); annotate a
      # vetted fixture with `secrets:allow` to suppress a false positive.
      - name: Secret scan
        run: pnpm secrets:check

      - name: Architecture check
        run: pnpm deps:check

      - name: Unit tests
        # Cap turbo concurrency: running all ~26 package suites at once (each with
        # its own vitest worker pool) oversubscribes the shared runner and starves
        # individual tests into per-test timeouts. 3 at a time + the 60s global
        # timeout keeps it reliable. (--concurrency is a TURBO flag — pass it to
        # turbo directly, NOT via `pnpm test -- …` which forwards it to vitest.)
        run: pnpm exec turbo run test --concurrency=3

      # scripts/ lives outside the workspace, so `turbo run test` never sees it.
      # Its suites were effectively dead code until 0.8.0 shipped a broken pack.
      - name: Script tests
        run: pnpm test:scripts

      # SUPPLY-002 (audit 2026-08-07): nothing in CI ever looked at whether a
      # dependency had a known vulnerability. Non-blocking on purpose — on a
      # 5600-dependency tree a blocking gate produces noise a single maintainer
      # will end up disabling, and a disabled gate is worse than none because it
      # reads as coverage. `high` and above only, so the signal stays readable.
      - name: Dependency audit (advisory)
        run: pnpm audit --audit-level=high || true

      # Audit finding: CI never actually built the apps (typecheck/lint catch
      # type/style errors but not a broken `next build` — e.g. a bad server
      # action boundary, an invalid import only webpack's build graph catches).
      # Full production build via turbo so a broken build fails CI instead of
      # only surfacing on deploy.
      - name: Build
        run: pnpm build

  # ── Pack smoke test ─────────────────────────────────────────────────────────
  # SUPPLY-001 (audit 2026-08-07). `pnpm build` builds the WORKSPACE; it says
  # nothing about the TARBALL. Two releases shipped a dead dashboard because
  # nothing ever started the packed product before publish:
  #   0.8.0 — 7 server chunks lost by Next's standalone copy;
  #   0.8.1 — `next: "^16.2.6"` re-resolved to 16.3.0 at install time, so the
  #           tarball broke with no commit, no release and no signal.
  # This packs, installs clean into an isolated HOME, and BOOTS it. The CLI's own
  # assertWebRenders makes `up` exit non-zero when the dashboard does not render,
  # so a broken tarball fails here instead of on a user's machine.
  #
  # Its own job, in parallel with `ci`: it runs a full `next build` plus a real
  # Postgres boot (~15 min), and folding that into `ci` would double the feedback
  # loop for every typo-level failure.
  # Quentin développe et fait tourner Nodal sur Windows ; la CI ne voyait que
  # Linux. Les pièges qui lui coûtent le plus — arbres de processus, ports
  # tenus, séparateurs de chemin, casse du système de fichiers — n'étaient donc
  # vus par personne avant lui.
  #
  # `continue-on-error` au départ, comme e2e-smoke l'a été : un job requis qui
  # échoue dès son premier passage se fait désactiver dans la semaine. Il
  # devient bloquant une fois vert plusieurs jours d'affilée.
  ci-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck et tests seulement : lint et format ne dépendent pas de l'OS,
      # les refaire ici doublerait le coût sans rien apprendre.
      - name: Typecheck
        run: pnpm typecheck

      # `--concurrency` est un drapeau TURBO : le passer par `pnpm test -- …`
      # le transmet à vitest, qui le refuse (`Unknown option --concurrency`).
      # Le job Linux le dit déjà en commentaire ; j'ai copié la ligne sans le
      # lire, et le premier passage Windows est mort là-dessus.
      - name: Unit tests
        run: pnpm exec turbo run test --concurrency=3

  pack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack, install clean, boot
        run: node scripts/smoke-pack.mjs

  # PERF-001 (audit 2026-08-07). 31 spec files, 85 tests, never run by CI —
  # so every UI regression this suite could catch had to be found by hand.
  #
  # Non-blocking on purpose, for now. The suite needs a real stack (web +
  # runner + embedded Postgres) and has never run on a CI runner: making it
  # required on day one would turn its first flake into a merge blocker and get
  # it disabled within a week. It reports; it does not gate. Flip
  # `continue-on-error` off once it has been green for a stretch.
  #
  # Three journeys only, the ones from the remediation plan: the app boots, an
  # agent can be created, an approval can be resolved. Running all 31 would take
  # the CI budget an order of magnitude past what this earns today.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @nodal-agents/web exec playwright install --with-deps chromium

      # NOT `pnpm --filter @nodal-agents/web e2e:up`: that wrapper shells out to
      # a globally-installed `nodal-agents` binary, which does not exist on a
      # runner checking out source. First attempt died on `spawn ENOENT`.
      # The dev stack from source brings up embedded Postgres + runner + web.
      - name: Boot the stack
        run: pnpm --filter nodal-agents exec tsx src/index.ts --dev &

      - name: Wait for the dashboard
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null; then echo "web up"; exit 0; fi
            sleep 5
          done
          echo "dashboard never answered on :3000"; exit 1

      # agent-flows.spec.ts is deliberately NOT in this list. It calls
      # requireLmStudio(), which probes a local LLM server on localhost:1234 —
      # it cannot exist on a GitHub runner, so the spec fails at its first line
      # ("LM_Studio_unresponsive") no matter how healthy the stack is. It stays
      # a local-only suite until those journeys run against a stubbed LLM.
      - name: Two journeys — boot/navigation and the autonomy tab
        run: >
          pnpm --filter @nodal-agents/web exec playwright test
          tests/e2e/smoke.spec.ts
          tests/e2e/autonomy-approvals.spec.ts

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
