name: CI Windows

# EXPERIMENT (#1057) — this file is restored before the PR is opened.
# Which form of the process-table read stays fast without PSModulePath and
# PSModuleAnalysisCachePath, on GitHub's Windows image (hundreds of modules).

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exp-ps-env:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Candidate reads, both variables removed
        timeout-minutes: 15
        run: node scripts/exp-ps-env.mjs
