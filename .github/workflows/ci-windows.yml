name: CI Windows

# Quentin développe et fait tourner Nodal sur Windows ; la CI ne voyait que
# Linux. Les pièges qui lui coûtent le plus — arbres de processus, ports
# tenus, séparateurs de chemin, casse du système de fichiers — n'étaient donc
# vus par personne avant lui.
#
# BLOQUANT depuis le 11/08, sur décision de Quentin. Il a été vert dès son
# premier passage utile — après avoir rendu deux défauts réels de comparaison
# de chemins, dont un qui cassait la livraison de fichiers temporaires sur
# macOS. Si ce job se met à flaker, la réponse n'est PAS de remettre
# `continue-on-error` mais de traiter la cause.
#
# Sur `main` et chaque nuit, PLUS sur les pull requests (#291, 2026-09-21) :
# en 29 min par PR il n'a jamais trouvé un défaut Windows que le job Linux
# avait laissé passer, et il doublait le temps d'attente de chaque PR. Un
# rouge ici se corrige par une PR de suite, et le portail le montre.

on:
  push:
    branches: [main]
  schedule:
    # 04:47 UTC : hors de la vague de l'heure, et après la mesure nocturne de
    # `qa.yml` (03:17), pour ne pas se disputer les runners avec elle.
    - cron: '47 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Images de runner explicites (issue #882) : `*-latest` bouge sans que le dépôt
# change. Le 30/10/2026 `ubuntu-latest` est passé à Ubuntu 26.04 et Playwright
# 1.60 a refusé d'y installer Chromium, sur toutes les PR. Passer à 26.04 se
# fera exprès, avec une version de Playwright qui la connaît. Garde :
# scripts/tests/runner-images.test.mjs (étape « Script tests » de `checks`).
jobs:
  # ── Ce qui tourne UNE fois ──────────────────────────────────────────────────
  # Typecheck et signatures du runtime VC++ ne dépendent pas de la tranche de
  # tests : les mettre dans chaque tranche les referait six fois pour le même
  # verdict. Ils ont leur job, donc leur runner : la vérification Authenticode
  # tourne sur une machine qu'aucune suite ne sature (c'était l'intention de
  # l'ordre « avant Unit tests », 2026-10-17), et un typecheck rouge
  # n'empêche pas les six tranches de rendre leur verdict.
  checks:
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose — pnpm/action-setup@v4 reads the
      # version from the `packageManager` field in the root package.json.
      # Specifying both causes ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      # Turborepo's own cache, persisted between runs, keyed per OS because
      # Linux and Windows artefacts are not interchangeable. The key carries
      # the SHA so each run writes its own entry; restore-keys falls back to
      # the most recent one, which is what makes an unchanged package a cache
      # hit. ~100 KB on Windows (typecheck declares no outputs, so only
      # logs and the up-to-date markers are stored — all that is needed to
      # SKIP them). UNE lignée par job (celle-ci, `checks`, et une par tranche
      # de `test`), comme dans ci.yml : une clé partagée n'aurait gardé que les
      # sorties du premier job fini.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-checks-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-checks-

      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      # Typecheck et tests seulement : lint et format ne dépendent pas de l'OS,
      # les refaire ici doublerait le coût sans rien apprendre.
      - name: Typecheck
        timeout-minutes: 10
        run: pnpm typecheck

      # Signatures Authenticode des DLL du runtime VC++ : seul Windows sait les
      # vérifier, et un PowerShell à froid dans la suite unitaire parallèle a
      # dépassé 80 s (2026-10-17).
      - name: Verify VC++ runtime signatures
        timeout-minutes: 6
        run: node scripts/verify-vc-runtime-signatures.mjs

  # ── La suite unitaire, en six tranches ──────────────────────────────────────
  # `pnpm test` en une seule étape durait 24 à 25 min sur un runner et 40 à 45
  # sur un autre, pour le même commit : tous les paquets sont ~1,65× plus lents
  # d'un coup (runner 1 159 s contre 1 875 s, web 918 s contre 1 546 s, tools
  # 311 s contre 532 s…), donc la cause est la machine, pas un test (issue
  # #1044). Le run 42864007304 a atteint la borne de 45 min sans aucun test rouge.
  #
  # LES TRANCHES SONT CELLES DE ci.yml, À LA LIGNE PRÈS : web et runner coupés en
  # deux par fichier (`--shard=k/2`), `packages-1` = tools + bench, `packages-2`
  # = tout le reste, définie par EXCLUSION pour qu'un paquet ajouté plus tard y
  # tombe sans que personne y pense. GitHub Actions ne partage pas une matrice
  # entre deux fichiers : la définition est donc écrite deux fois, et
  # scripts/tests/ci-shards.test.mjs fait rougir la CI Linux (étape « Script
  # tests ») si les deux listes de tranches divergent ou si l'une perd un
  # paquet. Une tranche se change dans les deux fichiers, ou la garde refuse.
  # Seules les limites de temps sont propres à Windows.
  #
  # Pourquoi les tranches de Linux et pas d'autres, calculées pour Windows : la
  # répartition Linux est équilibrée à 4 % près sur des durées mesurées, et
  # l'écart Windows/Linux est un facteur quasi uniforme sur tous les paquets d'un
  # même run : une tranche équilibrée sur l'un l'est sur l'autre.
  #
  # LIMITES A MESURER
  test:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: web-1
            run: pnpm exec turbo run test --continue=dependencies-successful --filter=@nodal-agents/web -- --shard=1/2
          - shard: web-2
            run: pnpm exec turbo run test --continue=dependencies-successful --filter=@nodal-agents/web -- --shard=2/2
          - shard: runner-1
            run: pnpm exec turbo run test --continue=dependencies-successful --filter=@nodal-agents/runner -- --shard=1/2
          - shard: runner-2
            run: pnpm exec turbo run test --continue=dependencies-successful --filter=@nodal-agents/runner -- --shard=2/2
          - shard: packages-1
            run: pnpm exec turbo run test --continue=dependencies-successful --filter=@nodal-agents/tools --filter=@nodal-agents/bench
          - shard: packages-2
            run: pnpm exec turbo run test --continue=dependencies-successful --filter=!@nodal-agents/web --filter=!@nodal-agents/runner --filter=!@nodal-agents/tools --filter=!@nodal-agents/bench
    name: test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      # Une lignée de cache turbo par tranche, par OS (voir `checks`). `test`
      # n'est jamais mis en cache (`turbo.json`, issue #698) : ce que cette
      # lignée garde, ce sont les `build` des dépendances de la tranche.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-test-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-test-${{ matrix.shard }}-

      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      # Le plafond de concurrence turbo (3) vit dans `turbo.json` depuis #292 :
      # `--concurrency` est un drapeau TURBO, et le passer par `pnpm test -- …`
      # le transmettait à vitest, qui le refusait. Plus de drapeau à copier.
      #
      # `NODAL_VITEST_REPORT_DIR` (#841) : chaque paquet y écrit ses résultats
      # (`<paquet>.vitest-report.json`, avec les fichiers qui n'ont jamais rendu
      # de résultat) et, si un worker meurt sans que vitest l'ait demandé, son
      # code de sortie, son signal et ses fichiers (`<paquet>.worker-exits.log`).
      # Le dossier part en artefact même quand l'étape est rouge, un par tranche.
      - name: Unit tests (${{ matrix.shard }})
        timeout-minutes: 35
        env:
          NODAL_VITEST_REPORT_DIR: ${{ runner.temp }}/vitest-reports
        run: ${{ matrix.run }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-reports-windows-${{ matrix.shard }}
          path: ${{ runner.temp }}/vitest-reports
          if-no-files-found: warn
