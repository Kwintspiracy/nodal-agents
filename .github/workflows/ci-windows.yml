name: CI Windows

# EXPERIMENT (#1056, step 1) — this file is restored before the PR is opened.
# One job, on its own runner, that runs ONLY the apps/cli test files that read
# the real process table, with no other package's tests in parallel, and
# measures a process-table read before and after them.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exp-process-table:
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - name: Measure reads (idle, before)
        timeout-minutes: 5
        run: node scripts/exp-measure-process-table.mjs before 3 env
      - name: Which dropped variable does the read need
        timeout-minutes: 10
        run: node scripts/exp-measure-process-table.mjs bisect 1 bisect
      - name: Measure reads inside a turbo task
        timeout-minutes: 5
        run: pnpm exec turbo run exp-measure --filter=nodal-agents
      - name: Real-table tests of apps/cli, vitest directly (no turbo)
        timeout-minutes: 20
        working-directory: apps/cli
        run: >-
          pnpm exec vitest run
          src/tests/down-fresh-record.test.ts
          src/tests/process-tree.test.ts
          src/tests/recorded-tree.test.ts
          src/tests/down-postgres-ownership.test.ts
          src/tests/detach.test.ts
          src/tests/postmaster-pid.test.ts
          src/tests/detach-keeps-postgres.pg.test.ts
          src/tests/down-fresh-install.pg.test.ts
      - name: Measure reads (idle, after)
        if: always()
        timeout-minutes: 5
        run: node scripts/exp-measure-process-table.mjs after 3
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-reports-windows-exp-process-table
          path: ${{ runner.temp }}/vitest-reports
          if-no-files-found: warn
