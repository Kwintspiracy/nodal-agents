name: Deploy Docs to GitHub Pages

# Deux sites, un seul déploiement : GitHub n'accorde qu'un environnement
# `github-pages` par dépôt. Les docs occupent la racine, le portail qualité
# vit sous `/qa/`. Ils ne partagent RIEN d'autre que l'hébergeur — le portail
# est un document autonome, sans runtime.
#
# Ce workflow REND et déploie ; il ne mesure jamais et il n'écrit rien dans le
# dépôt. Une seule exception au « il ne mesure pas » : la part GitHub du portail
# (le tableau des chantiers, le prix d'une pull request) est relue à chaque
# rendu, parce qu'elle vieillit en minutes là où la mesure vieillit en jours.
#
# Le portail visait Cloudflare Pages (`qa-pages.yml`, supprimé ici). Le motif
# était de pouvoir mettre une porte devant : le dépôt est public et le portail
# montre l'état interne du travail. Cette porte n'a jamais été posée, les
# secrets Cloudflare non plus, et le portail n'a donc JAMAIS été en ligne. Un
# portail hors ligne ne protège rien, il n'informe personne. Il passe ici, où
# le déploiement fonctionne déjà.

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      # Le portail est rendu ici : son code ET ses données republient.
      - 'apps/qa/**'
  # La mesure nocturne committe `apps/qa/data` avec `GITHUB_TOKEN` et
  # `[skip ci]` : ce push ne déclenche AUCUN workflow, `paths` compris. Sans ce
  # `workflow_run`, chaque nuit mesurerait pour rien et le portail en ligne
  # resterait figé (leçon de la revue Codex du 11/09, héritée de qa-pages.yml).
  workflow_run:
    workflows: ['Quality — full measurement']
    types: [completed]
  # Le tableau des chantiers vieillit en minutes, la mesure en jours. Publier
  # les deux au rythme de la mesure faisait afficher « To do » le soir sur une
  # issue fermée à 14:05. Chaque événement GitHub republie donc la page, qui
  # relit AVANT de rendre la seule part que GitHub donne en une seconde.
  issues:
    types: [opened, closed, reopened, labeled, unlabeled, edited]
  # `pull_request_target` et non `pull_request` : l'environnement `github-pages`
  # n'autorise que `main`, et un déclenchement `pull_request` faisait échouer le
  # déploiement sur CHAQUE pull request (« refs/pull/N/merge is not allowed to
  # deploy », run 34944913597). Ici le contexte est celui de la branche de base.
  # Aucun code de la pull request n'est exécuté : le job fait `checkout` de
  # `main` explicitement, et ne rend que le portail.
  pull_request_target:
    branches: [main]
    types: [opened, closed, reopened, labeled, ready_for_review, converted_to_draft]
  schedule:
    # Le filet : les états de la CI ne portent aucun événement d'issue, et un
    # webhook se perd. 41 et non 0 pour ne pas rejoindre la vague de l'heure.
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # `collect.mjs --github-only` interroge `gh`. En lecture seule, comme la
  # mesure nocturne, mais il lui faut le droit de demander.
  issues: read
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publier ce qu'une mesure RATÉE a laissé derrière elle donnerait un portail
    # à moitié écrit, présenté comme l'état du jour.
    # Une mesure RATÉE laisse des données à moitié écrites ; les publier les
    # présenterait comme l'état du jour.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          # `workflow_run` part du SHA qui a déclenché la mesure, pas du commit
          # de données qu'elle vient de pousser. Sans ce `ref`, on publierait
          # l'état d'AVANT la mesure.
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter @nodal-agents/docs build

      # La part GitHub, relue à l'instant et reposée sur la mesure committée.
      # Elle N'EST PAS committée : ce workflow rend, il n'enregistre pas. La
      # mesure nocturne reste seule à écrire dans `apps/qa/data/`, sinon
      # l'historique du portail deviendrait celui de ses déploiements.
      # GitHub muet laisse le tableau committé en place, daté comme tel.
      - name: Rafraîchir le tableau depuis GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/qa/collect.mjs --github-only

      # `build.mjs` ne lit que `apps/qa/data/*.json` : il REND, il ne mesure
      # pas. La page porte les deux dates, « measured » et « board as of ».
      - name: Rendre le portail qualité
        run: node apps/qa/build.mjs

      - name: Poser le portail sous /qa/
        run: |
          mkdir -p apps/docs/out/qa
          cp apps/qa/dist/index.html apps/docs/out/qa/index.html
          test -s apps/docs/out/qa/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
