name: Deploy Docs to GitHub Pages

# Deux sites, un seul déploiement : GitHub n'accorde qu'un environnement
# `github-pages` par dépôt. Les docs occupent la racine, le portail qualité
# vit sous `/qa/`. Ils ne partagent RIEN d'autre que l'hébergeur — le portail
# est un document autonome, avec son propre design.

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      # Le portail se reconstruit quand son code OU ses données changent — donc
      # après chaque mesure nocturne, qui committe `apps/qa/data/`.
      - 'apps/qa/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter @nodal-agents/docs build

      # Le portail est rendu à partir des données DÉJÀ committées par la mesure
      # nocturne — on ne relance aucun test ici. Un déploiement doit publier ce
      # qui a été mesuré, pas mesurer à nouveau : sinon deux exécutions du même
      # commit donneraient deux vérités.
      - name: Build the quality portal
        run: node apps/qa/build.mjs

      - name: Place the portal under /qa
        run: |
          mkdir -p apps/docs/out/qa
          cp -r apps/qa/dist/. apps/docs/out/qa/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
