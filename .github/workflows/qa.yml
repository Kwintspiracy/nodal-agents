name: Quality — full measurement

# Ce workflow ne garde rien : il MESURE, et il écrit ce qu'il a mesuré dans
# `apps/qa/data/`. C'est cette écriture, répétée, qui donne au portail son
# historique — donc les réponses à « combien de fois ça tourne » et « à quelle
# régularité ». Un rendu statique ne les aura jamais.
#
# Il reste la SEULE écriture de `apps/qa/data/`. Le tableau des chantiers, lui,
# est relu à chaque événement GitHub par `docs.yml`, qui repose la part GitHub
# sur cette mesure sans jamais la committer.
#
# Pourquoi la nuit et pas à chaque commit : la mesure complète instrumente
# 34 paquets et joue 30 parcours navigateur. À chaque push elle doublerait le
# temps de CI pour un chiffre qui ne bouge pas d'un commit à l'autre. Les
# portes qui doivent bloquer une PR restent dans `ci.yml`.

on:
  schedule:
    # 03:17 UTC — une heure creuse, et une minute qui n'est ni 0 ni 30 pour ne
    # pas rejoindre la vague de tous les crons de la planète.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # `alerte.mjs --appliquer` ouvre, met à jour et ferme SON billet. Sans cette
  # ligne le jeton n'a pas le droit d'écrire une issue : chaque tentative aurait
  # échoué, et le `|| true` de l'étape l'aurait masquée — une alerte qui ne part
  # jamais et personne pour le dire (revue Codex du 11/09).
  issues: write
  # `collect.mjs` interroge `gh` pour le tableau. En lecture seule, mais il lui
  # faut le droit de demander.
  pull-requests: read

concurrency:
  group: qa-mesure
  cancel-in-progress: false

jobs:
  mesure:
    runs-on: ubuntu-latest
    # Chaque étape longue a sa borne, et leur somme passe sous celle du job :
    # ~2 min de mise en place, couverture 35, banc 5, Playwright 12, démarrage
    # 10, parcours 20, ~3 pour la suite = 87. Mesuré sur les nuits du 24 au
    # 26/09 : couverture 21-22 min, parcours 11,3, job 30-35. Sans ces bornes,
    # une étape figée consommait le job entier, et ce qui la suit (le journal
    # de la stack, la collecte, l'enregistrement) ne tournait jamais (revue
    # Codex de la PR #516). Un dépassement de JOB tue tout ; un dépassement
    # d'ÉTAPE avec `continue-on-error` la marque en échec et laisse la nuit
    # enregistrer ce qu'elle a mesuré.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          # Le job réécrit `apps/qa/data/` et pousse : il lui faut l'historique
          # git, pas un checkout superficiel.
          fetch-depth: 0
          # ET il lui faut MAIN, quelle que soit la branche d'où part le
          # déclenchement manuel. Sans cette ligne, un `workflow_dispatch` lancé
          # depuis une branche mesurait cette branche puis poussait `HEAD:main` :
          # tout son code partait sur main, pas seulement les données de mesure,
          # sans revue et sans que les portes aient à passer. La mesure décrit
          # main ; elle n'est pas un chemin pour y arriver (revue Codex 11/09).
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        # Bounded: a registry stall must not eat the job budget that the steps
        # after it (boot, stack log, uploads) count on (review of PR #516).
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      # ── Couverture, paquet par paquet ──────────────────────────────────────
      # Surtout PAS un `vitest run --coverage` unique à la racine : chaque
      # paquet porte son propre environnement (DATABASE_URL, mocks), qu'un
      # lancement racine n'applique pas — 421 tests tombent alors pour une
      # raison qui n'a rien à voir avec le code (constaté le 10/09/2026).
      #
      # Un paquet qui échoue ne doit pas priver le portail des 32 autres
      # mesures : la boucle continue. Mais elle ne continue plus EN SILENCE —
      # elle laisse `coverage/mesure-echouee.json` avec le code de sortie, que
      # `collect.mjs` relit. Sans ce témoin, une mesure qui échoue et une mesure
      # que personne n'a lancée donnaient exactement la même ligne vide, et
      # c'est ce qui a laissé `@nodal-agents/auth` sans cause pendant quatre
      # semaines (issue #58). Le fichier vit dans `coverage/`, déjà ignoré par
      # git : il ne part nulle part.
      #
      # La liste des paquets volontairement hors mesure est DEMANDÉE au portail
      # (`collect.mjs --hors-mesure`), pas répétée ici : une seconde copie finit
      # par diverger de celle que la page affiche.
      #
      # Le second `--reporter=json` écrit `tests-run.json` à côté de la
      # couverture : c'est lui qui alimente la mémoire test par test, donc
      # l'instabilité — qu'aucune exécution isolée ne sait voir. Même passage,
      # deux sorties : la mesure ne coûte pas un run de plus.
      #
      # Chaque paquet a 15 min (`timeout 900`) : un paquet figé rend le code 124,
      # écrit dans son témoin comme tout autre échec, et la boucle passe au
      # suivant. L'étape entière a 35 min ; au-delà elle est marquée en échec et
      # la nuit continue (voir la borne du job).
      - name: Couverture par paquet
        timeout-minutes: 35
        continue-on-error: true
        run: |
          hors_mesure=$(node apps/qa/collect.mjs --hors-mesure)
          echo "hors mesure (volontaire) : ${hors_mesure:-aucun}"
          for d in packages/* packages/adapters/* apps/*; do
            [ -f "$d/package.json" ] || continue
            name=$(node -p "require('./$d/package.json').name" 2>/dev/null) || continue
            if printf '%s\n' "$hors_mesure" | grep -qxF "$name"; then
              echo "  ($name — hors mesure, volontaire)"
              continue
            fi
            echo "::group::$name"
            rm -rf "$d/coverage"
            if (cd "$d" && timeout 900 npx vitest run --coverage --coverage.reporter=json-summary --reporter=dot --reporter=json --outputFile=tests-run.json); then
              echo "  (mesuré)"
            else
              code=$?
              mkdir -p "$d/coverage"
              printf '{"code":%s}\n' "$code" > "$d/coverage/mesure-echouee.json"
              echo "  (échec — code $code — on continue)"
            fi
            echo "::endgroup::"
          done

      # ── Le banc ────────────────────────────────────────────────────────────
      # Il sort en 1 sur régression ; ici on ne veut pas arrêter la mesure, on
      # veut l'ENREGISTRER. La porte bloquante, elle, vit dans `ci.yml`.
      # Chemin ABSOLU : `pnpm bench` délègue à `pnpm --filter @nodal-agents/bench`,
      # donc le CLI tourne dans `packages/bench` et un chemin relatif visait
      # `packages/bench/apps/qa/data/` — un dossier qui n'existe pas. L'erreur
      # était avalée et aucun rapport n'arrivait au collecteur (revue Codex).
      #
      # Le rapport de la VEILLE est effacé d'abord. Il est versionné avec les
      # données — donc présent même sur un runner neuf — et si le banc plante
      # avant d'écrire, `|| true` laisse continuer et le collecteur relirait
      # l'ancien : un vert d'hier présenté comme la mesure de cette nuit. Le
      # rapport Playwright a déjà sa garde, dans « Normaliser le rapport »
      # (revue Codex, 3e passe).
      - name: Banc d'essai
        timeout-minutes: 5
        continue-on-error: true
        run: |
          mkdir -p apps/qa/data
          rm -f apps/qa/data/bench-run.json
          pnpm bench --json "$GITHUB_WORKSPACE/apps/qa/data/bench-run.json" || true

      - name: Install Playwright browsers
        timeout-minutes: 12
        run: |
          for i in 1 2; do
            timeout 300 pnpm --filter @nodal-agents/web exec playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $i failed or hung — retrying"
          done
          exit 1

      # `NODALAI_ALLOW_OAUTH_MOCK` — contrairement au job `e2e-smoke`, ce
      # workflow joue les parcours OAuth, qui présentent un code d'autorisation
      # synthétique `mock-`. La route de callback ne l'accepte qu'avec ce
      # drapeau ; sans lui ces parcours tentent un vrai échange de jeton chez le
      # fournisseur et échouent quoi que vaille le produit (revue Codex).
      # Posé sur CETTE stack de test isolée, jamais ailleurs.
      #
      # Le lancement et l'attente sont UN script, le même que `ci.yml` (#514) :
      # il suit le processus du CLI, s'arrête dès que la stack répond ou meurt,
      # et garde toute sa sortie dans `stack.log` (publié plus bas). Avant, un
      # `&` perdait la sortie à la fin de l'étape et une boucle sondait 5 min à
      # l'aveugle, même un CLI déjà mort. Le plafond du script est de 8 min ; 10
      # ici lui laissent le temps d'imprimer avant que l'étape soit coupée.
      - name: Boot the stack
        timeout-minutes: 10
        env:
          NODALAI_ALLOW_OAUTH_MOCK: '1'
        run: node scripts/boot-stack.mjs --log "$RUNNER_TEMP/stack.log"

      # TOUS les parcours, pas les deux de `ci.yml`. C'est le point de ce
      # workflow : le 10/09/2026, la première exécution des 28 parcours que la
      # CI ne jouait pas a rendu 25 rouges. Personne ne pouvait le savoir.
      #
      # PLUS AUCUNE EXCLUSION depuis l'issue #110. `agent-flows.spec.ts` était
      # la seule, parce qu'il sondait un LM Studio sur localhost:1234 qui
      # n'existe sur aucun runner ; il est supprimé, et aucun parcours n'exige
      # plus de modèle. Un fichier présent dans le dossier est donc un fichier
      # joué — c'est ce que le portail vérifie, et un parcours jamais joué y
      # est désormais un rouge nommé.
      # La liste reste construite par un `ls` plutôt que passée en dossier : le
      # portail LIT ce workflow pour savoir quels parcours tournent
      # (`parcoursDunWorkflow`), et c'est cette forme-là qu'il sait lire. Un
      # `playwright test tests/e2e` ferait passer les trente parcours pour
      # jamais joués sur la page Journeys.
      - name: Tous les parcours
        timeout-minutes: 20
        continue-on-error: true
        run: |
          mapfile -t specs < <(ls tests/e2e/*.spec.ts)
          echo "${#specs[@]} parcours à jouer"
          npx playwright test "${specs[@]}" --reporter=json > playwright-raw.json || true
        working-directory: apps/web

      # Ce que l'utilisateur aurait VU au moment où ça a cassé.
      #
      # Le portail sait dire quel test est rouge et depuis quand ; il s'arrêtait
      # là, et un nom de test dans un tableau est un cul-de-sac. Playwright
      # écrit ses traces et ses captures dans `apps/web/test-results`
      # (`outputDir` par défaut, relatif à la config) : les publier fait du lien
      # « voir le run » un vrai chemin vers le symptôme.
      #
      # `screenshot: 'only-on-failure'` et `trace: 'on-first-retry'` dans
      # `playwright.config.ts` : il n'y a donc rien pour un test vert, et c'est
      # exactement ce qu'on veut — un artefact de 30 parcours verts pèserait
      # lourd pour ne rien montrer.
      #
      # `if: always()` : l'étape des parcours se termine par `|| true`, mais une
      # étape suivante peut échouer, et c'est précisément une nuit qui tourne
      # mal qu'on veut pouvoir regarder. 14 jours : au-delà, un rouge non traité
      # n'est plus une régression qu'on diagnostique, c'est une dette.
      - name: Publier les traces des parcours en échec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parcours-en-echec
          path: apps/web/test-results
          retention-days: 14
          # Rien à publier = tous les parcours sont verts. Ce n'est pas une
          # anomalie, et l'avertissement par défaut ferait chercher une panne.
          if-no-files-found: ignore

      # Ce que la stack a écrit pendant toute la nuit : son démarrage, et ce
      # qu'elle a dit pendant que les parcours la testaient (#514).
      - name: Publier le journal de la stack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-log
          path: ${{ runner.temp }}/stack.log
          retention-days: 14
          if-no-files-found: ignore

      # La sortie JSON de Playwright peut être précédée d'une ligne du
      # global-setup ; on repart de la première accolade.
      # Si Playwright n'émet aucun rapport, l'ANCIEN est effacé.
      #
      # Sans ça, la collecte qui suit attachait les résultats de la veille à un
      # horodatage et un commit frais : des mesures périmées présentées comme
      # celles du jour. C'est précisément le mensonge que ce portail existe pour
      # empêcher (revue Codex). Mieux vaut une case vide qu'une case fausse.
      #
      # Un rapport ILLISIBLE compte comme absent : les parcours coupés par leur
      # borne laissent un JSON à moitié écrit, et un `JSON.parse` qui jette ici
      # faisait sauter la collecte et l'enregistrement de toute la nuit (revue
      # Codex de la PR #516, passe 3).
      - name: Normaliser le rapport
        run: |
          node -e "
            const fs=require('fs');
            const cible='apps/qa/data/playwright-run.json';
            fs.mkdirSync('apps/qa/data',{recursive:true});
            let brut='';
            try { brut=fs.readFileSync('apps/web/playwright-raw.json','utf8'); } catch {}
            const i=brut.indexOf('{');
            let rapport=null;
            if(i>=0){ try { rapport=JSON.parse(brut.slice(i)); } catch {} }
            if(rapport===null){
              if(fs.existsSync(cible)) fs.rmSync(cible);
              console.log('::warning::Playwright n a emis aucun rapport lisible — l ancien est efface plutot que servi comme neuf.');
              process.exit(0);
            }
            fs.writeFileSync(cible, brut.slice(i));
            const s=rapport.stats||{};
            console.log('verts',s.expected,'rouges',s.unexpected,'ignores',s.skipped);
          "

      # `GH_TOKEN` est indispensable ICI : sur un runner neuf, `gh` n'est
      # authentifié nulle part. Sans lui les deux requêtes de `chantiers()`
      # échouaient, et le portail publiait un tableau marqué ABSENT chaque nuit —
      # mieux qu'un Kanban vide, mais toujours pas le vrai (revue Codex 11/09).
      - name: Collecter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/qa/collect.mjs

      # L'historique doit SURVIVRE au runner : c'est la seule donnée de ce
      # workflow qui ne se recalcule pas. `[skip ci]` évite qu'un push de
      # données ne relance la CI en boucle.
      # Un merge ordinaire pendant l'heure de mesure faisait avancer main, et ce
      # push partait alors en non-fast-forward : la mesure mourait avec le
      # runner, l'alerte et l'artefact étaient sautés, et la publication refusait
      # un run en échec. Le groupe de concurrence ne sérialise que les mesures
      # entre elles, pas les merges des humains (revue Codex 11/09).
      #
      # On rejoue donc le commit de DONNÉES sur le main le plus récent, trois
      # fois au plus. Seul `apps/qa/data/` est réécrit, et personne d'autre n'y
      # touche : reposer les fichiers sur un main frais est sans ambiguïté.
      #
      # Le dossier est VIDÉ avant d'être reposé. `reset --hard` restaure les
      # fichiers suivis et `cp` ne propage aucune suppression : un rapport
      # Playwright effacé plus haut faute de résultat serait revenu dans le
      # commit, et une collecte suivante l'aurait recompté (revue Codex, 3e
      # passe). Le premier `git diff` compte aussi les fichiers NON SUIVIS :
      # une première nuit n'écrit que des fichiers neufs.
      - name: Enregistrer la mesure
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- apps/qa/data && [ -z "$(git ls-files --others --exclude-standard apps/qa/data)" ]; then
            echo "rien de neuf à enregistrer"
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/mesure"
          cp -r apps/qa/data/. "$RUNNER_TEMP/mesure/"

          for essai in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf apps/qa/data
            mkdir -p apps/qa/data
            cp -r "$RUNNER_TEMP/mesure/." apps/qa/data/
            git add --all apps/qa/data
            if git diff --cached --quiet; then
              echo "main porte déjà cette mesure"
              exit 0
            fi
            git commit -m "chore(qa): mesure du $(date -u +%Y-%m-%d) [skip ci]"
            if git push origin HEAD:main; then
              echo "mesure enregistrée (essai $essai)"
              exit 0
            fi
            echo "main a bougé pendant la mesure — on rejoue (essai $essai)"
          done

          echo "::error::trois tentatives, main bouge trop vite : la mesure n'a pas pu être enregistrée"
          exit 1

      # Un tableau qu'il faut penser à ouvrir n'existe pas. Ce geste est le seul
      # qui manquait : quand quelque chose est rouge, le portail ouvre l'issue
      # lui-même, et elle atterrit dans le Kanban à sa colonne. UNE issue tenue
      # à jour, fermée dès qu'elle n'a plus rien à dire — un robot qui ouvre
      # douze billets par nuit se fait couper au bout de trois jours.
      #
      # `|| true` : ne jamais faire échouer la mesure parce que l'alerte n'a pas
      # pu écrire. Ce serait perdre la mesure ET l'alerte.
      - name: Alerter si quelque chose est rouge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/qa/alerte.mjs --appliquer || true

      - name: Rendre le portail
        run: node apps/qa/build.mjs

      - name: Publier le portail comme artefact du run
        uses: actions/upload-artifact@v4
        with:
          name: portail-qualite
          path: apps/qa/dist
          retention-days: 30
